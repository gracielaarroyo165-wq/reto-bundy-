<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reto: agua, coca y chatarra</title>
</head>
<body>
<style>
  :root{
    --bg: #F6F1FB;
    --bg-card: #FFFFFF;
    --purple-deep: #6B3FA0;
    --purple: #9B6FCB;
    --purple-light: #E4D4F5;
    --pink: #E8A9C8;
    --pink-light: #FBE6F0;
    --rose: #C2185B;
    --rose-light: #F6D9E6;
    --amber: #9C6B2E;
    --amber-light: #F1E2C4;
    --ink: #3A2A52;
    --ink-soft: #7A6B94;
    --line: #E7DBF5;
    font-family: 'Work Sans', -apple-system, sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  #reto-root { background: var(--bg); color: var(--ink); min-height: 100%; padding: 18px 14px 32px; max-width: 480px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 18px; }
  .header h1 { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 24px; color: var(--purple-deep); margin: 0 0 4px; line-height: 1.15; }
  .header p { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
  .streak-band { background: linear-gradient(135deg, var(--purple-deep), var(--purple)); border-radius: 20px; padding: 18px 16px; color: white; display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; box-shadow: 0 8px 20px rgba(107,63,160,0.25); }
  .streak-num { font-family: 'Baloo 2', sans-serif; font-size: 40px; font-weight: 800; line-height: 1; }
  .streak-label { font-size: 12px; opacity: 0.9; margin-top: 2px; }
  .streak-flame { font-size: 34px; }
  .streak-best { text-align: right; font-size: 12px; opacity: 0.85; }
  .streak-best b { font-size: 16px; display:block; font-family:'Baloo 2',sans-serif; }
  .card { background: var(--bg-card); border-radius: 18px; padding: 16px; margin-bottom: 14px; border: 1px solid var(--line); }
  .card-title { display: flex; align-items: center; gap: 8px; font-family: 'Baloo 2', sans-serif; font-weight: 600; font-size: 16px; margin-bottom: 10px; }
  .card-title .emoji { font-size: 20px; }
  .cola-row { display:flex; align-items:center; gap:10px; }
  .stepper { display:flex; align-items:center; gap:0; border: 1.5px solid var(--rose-light); border-radius: 12px; overflow: hidden; }
  .stepper button { background: var(--rose-light); border: none; width: 38px; height: 38px; font-size: 18px; color: var(--rose); cursor: pointer; }
  .stepper button:disabled { opacity: 0.4; }
  .stepper .val { min-width: 74px; text-align: center; font-weight: 600; font-size: 15px; }
  .stepper.junk { border-color: var(--amber-light); }
  .stepper.junk button { background: var(--amber-light); color: var(--amber); }
  .status-junk-bad { background: var(--amber-light); color: var(--amber); }
  .cola-status { margin-top: 10px; font-size: 13px; padding: 8px 10px; border-radius: 10px; font-weight: 500; }
  .status-good { background: #E7F3E3; color: #3E7A3E; }
  .status-bad { background: var(--rose-light); color: var(--rose); }
  .zero-btn { margin-top: 10px; width: 100%; background: white; border: 1.5px solid var(--purple); color: var(--purple-deep); font-weight: 600; font-size: 13.5px; padding: 9px; border-radius: 10px; cursor: pointer; }
  .zero-btn.active { background: var(--purple); color: white; }
  .zero-btn:disabled { opacity: 0.5; }
  .glasses { display:flex; flex-wrap:wrap; gap: 8px; margin-bottom: 8px;}
  .glass { width: 38px; height: 46px; border: 2px solid var(--purple-light); border-radius: 6px 6px 10px 10px; background: white; cursor: pointer; display:flex; align-items:flex-end; justify-content:center; font-size: 16px; transition: background 0.15s; position: relative; }
  .glass.filled { background: var(--purple-light); border-color: var(--purple); }
  .glass.disabled { pointer-events: none; opacity: 0.6; }
  .water-total { font-size: 13px; color: var(--ink-soft); }
  .water-total b { color: var(--purple-deep); }
  .save-card { text-align: center; }
  .save-preview { font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; }
  .save-btn { width: 100%; padding: 14px; border-radius: 14px; border: none; font-family:'Baloo 2',sans-serif; font-weight: 700; font-size: 16px; cursor: pointer; color: white; background: linear-gradient(135deg, var(--purple-deep), var(--pink)); }
  .saved-banner { text-align:center; padding: 12px; border-radius: 14px; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  .saved-banner.win { background:#E7F3E3; color:#3E7A3E; }
  .saved-banner.mid { background: var(--pink-light); color: var(--purple-deep); }
  .saved-banner.fail { background: var(--rose-light); color: var(--rose); }
  .edit-link { background: none; border: none; text-decoration: underline; color: var(--ink-soft); font-size: 12.5px; cursor: pointer; padding: 4px; }
  .pet-card { text-align: center; }
  .pet-name { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 19px; color: var(--purple-deep); margin-bottom: 0px; }
  .pet-stage-label { font-size: 12px; color: var(--ink-soft); margin-bottom: 8px; }
  .pet-wrap { position: relative; display:inline-block; margin: 6px auto 10px; }
  .pet-anim { transform-origin: 50% 85%; }
  .pet-anim.joy { animation: pet-bounce 1.1s ease-in-out infinite; }
  .pet-anim.happy { animation: pet-sway 2.4s ease-in-out infinite; }
  .pet-anim.waiting { animation: pet-sway 3.2s ease-in-out infinite; }
  .pet-anim.meh { animation: pet-sway 3.6s ease-in-out infinite; }
  .pet-anim.sad { animation: pet-droop 3.6s ease-in-out infinite; opacity: 0.94; }
  @keyframes pet-bounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.03); } }
  @keyframes pet-sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  @keyframes pet-droop { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(3px) rotate(1deg); } }
  .sparkle { position: absolute; font-size: 14px; animation: pet-twinkle 1.4s ease-in-out infinite; }
  @keyframes pet-twinkle { 0%, 100% { opacity: 0; transform: scale(0.6) translateY(0); } 50% { opacity: 1; transform: scale(1) translateY(-4px); } }
  .pet-progress { height: 8px; background: var(--line); border-radius: 6px; overflow: hidden; margin-top: 4px; }
  .pet-progress-fill { height: 100%; background: var(--purple); border-radius: 6px; transition: width 0.4s ease; }
  .pet-next { font-size: 11.5px; color: var(--ink-soft); margin-top: 6px; }
  .week-strip { display: flex; justify-content: space-between; gap: 6px; }
  .day-chip { flex:1; text-align:center; background: var(--bg); border-radius: 12px; padding: 8px 2px; font-size: 11px; }
  .day-chip .dow { color: var(--ink-soft); margin-bottom:4px; }
  .day-chip .icon { font-size: 18px; }
  .day-chip.today { border: 2px solid var(--purple); }
  .loading { text-align:center; padding: 40px 0; color: var(--ink-soft); font-size:14px; }
  .confetti-layer { position: fixed; inset:0; pointer-events:none; z-index: 999; }
  .celebrate-toast {
    position: fixed; left: 50%; top: 18%; transform: translate(-50%, -10px);
    background: linear-gradient(135deg, var(--purple-deep), var(--pink));
    color: white; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 18px;
    padding: 14px 22px; border-radius: 16px; box-shadow: 0 10px 24px rgba(107,63,160,0.35);
    z-index: 1000; opacity: 0; transition: opacity 0.35s ease, transform 0.35s ease; text-align: center;
  }
  .celebrate-toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
<div id="reto-root"><div class="loading" id="loading">Cargando tu reto...</div></div>
<script>
(function(){
  const DOW = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const WATER_GOAL_ML = 2000;
  const GLASS_ML = 250;
  const COLA_MAX_ML = 350;
  const STORAGE_KEY = 'reto-v3:days';
  const PET_NAME = 'Bundy';

  function todayKey(d){ const dt = d || new Date(); return dt.toISOString().slice(0,10); }
  function fmtDate(key){ const [y,m,d] = key.split('-').map(Number); return new Date(y, m-1, d); }

  let state = { days: {} };

  function localGet(key){ try { return localStorage.getItem(key); } catch(e) { return null; } }
  function localSet(key, value){ try { localStorage.setItem(key, value); return true; } catch(e) { return false; } }

  async function loadState(){
    const local = localGet(STORAGE_KEY);
    if (local) { try { state.days = JSON.parse(local); return; } catch(e) {} }
    if (typeof window.storage !== 'undefined') {
      try { const r = await window.storage.get(STORAGE_KEY, false); if (r && r.value) state.days = JSON.parse(r.value); } catch(e) {}
    }
  }

  let saveQueue = Promise.resolve();
  function setSaveStatus(text, isError){
    const el = document.getElementById('save-status');
    if (!el) return;
    el.textContent = text;
    el.style.color = isError ? 'var(--rose)' : 'var(--ink-soft)';
  }
  function persist(){
    setSaveStatus('Guardando...', false);
    saveQueue = saveQueue.then(() => writeWithRetry()).then(ok => {
      setSaveStatus(ok ? 'Guardado ✓' : 'No se pudo guardar — usá el respaldo manual de abajo', !ok);
    });
    return saveQueue;
  }
  async function writeWithRetry(){
    const payload = JSON.stringify(state.days);
    if (localSet(STORAGE_KEY, payload)) return true;
    if (typeof window.storage !== 'undefined') {
      try { const res = await window.storage.set(STORAGE_KEY, payload, false); if (res) return true; } catch(e) {}
    }
    return false;
  }

  function getDay(key){
    if (!state.days[key]) state.days[key] = { cola: 0, zero: false, glasses: 0, junk: 0, saved: false };
    return state.days[key];
  }

  function colaOk(day){ return day.zero ? day.cola === 0 : day.cola <= COLA_MAX_ML; }
  function waterOk(day){ return day.glasses * GLASS_ML >= WATER_GOAL_ML; }
  function junkOk(day){ return day.junk === 0; }
  function pillarsMet(day){ return [colaOk(day), waterOk(day), junkOk(day)].filter(Boolean).length; }
  function dayWin(day){ return pillarsMet(day) === 3; }

  function computeStreak(){
    let streak = 0;
    let cursor = new Date();
    for (let i=0; i<3650; i++){
      const key = todayKey(cursor);
      const entry = state.days[key];
      if (entry && entry.saved) {
        if (dayWin(entry)) streak++;
        else break;
      } else if (i === 0) {
        // today not saved yet — keep checking yesterday
      } else {
        break;
      }
      cursor.setDate(cursor.getDate()-1);
    }
    return streak;
  }

  function computeBest(){
    const keys = Object.keys(state.days).filter(k => state.days[k].saved).sort();
    let best = 0, cur = 0, prevDate = null;
    for (const k of keys){
      const entry = state.days[k];
      const d = fmtDate(k);
      if (prevDate){ const diff = Math.round((d - prevDate)/86400000); if (diff !== 1) cur = 0; }
      if (dayWin(entry)) { cur++; best = Math.max(best,cur); } else cur = 0;
      prevDate = d;
    }
    return best;
  }

  function last7Keys(){
    const arr = []; const cursor = new Date();
    for (let i=6;i>=0;i--){ const d = new Date(); d.setDate(cursor.getDate()-i); arr.push(todayKey(d)); }
    return arr;
  }

  const PET_STAGES = [
    { min: 0,  label: 'Cachorro' },
    { min: 3,  label: 'Gato joven' },
    { min: 8,  label: 'Gato grande' },
    { min: 15, label: 'Súper gato' },
    { min: 25, label: 'Gato campeón' },
  ];
  function computeTotalWins(){ return Object.values(state.days).filter(d => d.saved && dayWin(d)).length; }
  function petStageIndex(totalWins){ let idx=0; for (let i=0;i<PET_STAGES.length;i++){ if (totalWins >= PET_STAGES[i].min) idx=i; } return idx; }

  function petMood(day){
    if (!day.saved) return 'waiting';
    const met = pillarsMet(day);
    if (met === 3) return 'joy';
    if (met === 2) return 'happy';
    if (met === 1) return 'meh';
    return 'sad';
  }

  function catSVG(stageIdx, mood){
    const bodyColors = { joy: '#9B6FCB', happy: '#B79BD9', waiting: '#CBB8E8', meh: '#B7AEC4', sad: '#A79AA8' };
    const bodyColor = bodyColors[mood];
    const blushOpacity = mood === 'sad' ? 0.25 : mood === 'meh' ? 0.45 : 0.75;
    let eyes, mouth, extra = '';
    if (mood === 'joy') {
      eyes = `<path d="M42 60 Q48 54 54 60" stroke="#3A2A52" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M72 60 Q78 54 84 60" stroke="#3A2A52" stroke-width="3.5" fill="none" stroke-linecap="round"/>
              <path d="M40 56 L36 51 M46 54 L44 48" stroke="#3A2A52" stroke-width="2" stroke-linecap="round"/>
              <path d="M86 56 L90 51 M80 54 L82 48" stroke="#3A2A52" stroke-width="2" stroke-linecap="round"/>`;
      mouth = `<path d="M48 78 Q63 92 78 78" stroke="#3A2A52" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    } else if (mood === 'happy') {
      eyes = `<circle cx="48" cy="60" r="5" fill="#3A2A52"/><circle cx="78" cy="60" r="5" fill="#3A2A52"/><circle cx="50" cy="58" r="1.6" fill="#fff"/><circle cx="80" cy="58" r="1.6" fill="#fff"/>`;
      mouth = `<path d="M50 78 Q63 87 76 78" stroke="#3A2A52" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
    } else if (mood === 'waiting') {
      eyes = `<circle cx="48" cy="60" r="4.5" fill="#3A2A52"/><circle cx="78" cy="60" r="4.5" fill="#3A2A52"/>`;
      mouth = `<line x1="54" y1="80" x2="72" y2="80" stroke="#3A2A52" stroke-width="3.5" stroke-linecap="round"/>`;
    } else if (mood === 'meh') {
      eyes = `<line x1="42" y1="60" x2="54" y2="60" stroke="#3A2A52" stroke-width="3.5" stroke-linecap="round"/><line x1="72" y1="60" x2="84" y2="60" stroke="#3A2A52" stroke-width="3.5" stroke-linecap="round"/>`;
      mouth = `<path d="M52 82 Q63 78 74 82" stroke="#3A2A52" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
    } else {
      eyes = `<path d="M42 58 L54 64" stroke="#3A2A52" stroke-width="3" stroke-linecap="round"/><path d="M84 58 L72 64" stroke="#3A2A52" stroke-width="3" stroke-linecap="round"/>`;
      mouth = `<path d="M50 86 Q63 76 76 86" stroke="#3A2A52" stroke-width="4" fill="none" stroke-linecap="round"/>`;
      extra = `<path d="M40 72 Q37 78 40 84" stroke="#8FCBEA" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    }
    let accessories = `<circle cx="63" cy="90" r="5.5" fill="#E8A9C8"/><path d="M57 90 L63 86 L69 90 L63 94 Z" fill="#D888B0"/>`;
    if (stageIdx >= 1) accessories += `<circle cx="63" cy="90" r="2" fill="#F6D9E6"/>`;
    if (stageIdx >= 3) accessories += `<path d="M28 58 Q10 88 32 116 L42 98 Z" fill="#B594D6" opacity="0.9"/>`;
    if (stageIdx >= 4) accessories += `<path d="M44 22 Q50 34 58 24 Q63 36 68 24 Q76 34 82 22 L80 32 L46 32 Z" fill="#E8A9C8"/><circle cx="50" cy="24" r="3" fill="#9B6FCB"/><circle cx="63" cy="20" r="3" fill="#9B6FCB"/><circle cx="76" cy="24" r="3" fill="#9B6FCB"/>`;
    return `
      <svg width="126" height="140" viewBox="0 0 126 140" xmlns="http://www.w3.org/2000/svg">
        <path d="M28 34 Q18 6 44 22 Z" fill="${bodyColor}"/>
        <path d="M98 34 Q108 6 82 22 Z" fill="${bodyColor}"/>
        <path d="M32 28 Q26 14 40 22 Z" fill="#F6D9E6"/>
        <path d="M94 28 Q100 14 86 22 Z" fill="#F6D9E6"/>
        <path d="M100 96 Q118 100 116 78 Q124 92 108 108 Z" fill="${bodyColor}"/>
        <ellipse cx="63" cy="82" rx="47" ry="43" fill="${bodyColor}"/>
        <ellipse cx="63" cy="120" rx="27" ry="10" fill="#FFFFFF" opacity="0.18"/>
        <circle cx="37" cy="78" r="7" fill="#F3B6A6" opacity="${blushOpacity}"/>
        <circle cx="89" cy="78" r="7" fill="#F3B6A6" opacity="${blushOpacity}"/>
        ${eyes}
        ${mouth}
        <circle cx="63" cy="72" r="2.5" fill="#D888B0"/>
        <circle cx="18" cy="80" r="1.6" fill="#3A2A52" opacity="0.55"/><circle cx="15" cy="86" r="1.6" fill="#3A2A52" opacity="0.55"/><circle cx="18" cy="92" r="1.6" fill="#3A2A52" opacity="0.55"/>
        <circle cx="108" cy="80" r="1.6" fill="#3A2A52" opacity="0.55"/><circle cx="111" cy="86" r="1.6" fill="#3A2A52" opacity="0.55"/><circle cx="108" cy="92" r="1.6" fill="#3A2A52" opacity="0.55"/>
        ${extra}
        ${accessories}
      </svg>`;
  }

  const CELEBRATE_MESSAGES = ['¡Lo lograste, Graciela! 🎉', '¡Día perfecto, Graciela! 💜', '¡Bien hecho, Graciela! 🐾'];
  function launchCelebration(){
    launchConfetti();
    const toast = document.createElement('div');
    toast.className = 'celebrate-toast';
    toast.textContent = CELEBRATE_MESSAGES[Math.floor(Math.random()*CELEBRATE_MESSAGES.length)];
    document.body.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('show'));
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 400);
    }, 2000);
  }
  function launchConfetti(){
    const layer = document.createElement('div'); layer.className = 'confetti-layer'; document.body.appendChild(layer);
    const colors = ['#9B6FCB','#E8A9C8','#6B3FA0','#F6D9E6'];
    for (let i=0;i<28;i++){
      const p = document.createElement('div');
      const size = 6+Math.random()*6;
      p.style.position='absolute'; p.style.width = size+'px'; p.style.height = size+'px';
      p.style.background = colors[i%colors.length]; p.style.left = (Math.random()*100)+'vw'; p.style.top = '-10px';
      p.style.borderRadius = Math.random()>0.5 ? '50%':'2px'; p.style.opacity = '0.9';
      p.style.transition = 'transform 1.4s ease-in, opacity 1.4s ease-in';
      layer.appendChild(p);
      requestAnimationFrame(()=>{ p.style.transform = `translateY(${70+Math.random()*30}vh) rotate(${Math.random()*360}deg)`; p.style.opacity = '0'; });
    }
    setTimeout(()=> layer.remove(), 1600);
  }

  function render(){
    const root = document.getElementById('reto-root');
    const key = todayKey();
    const day = getDay(key);
    const streak = computeStreak();
    const best = Math.max(computeBest(), streak);
    const met = pillarsMet(day);
    const locked = day.saved;

    const totalWins = computeTotalWins();
    const stageIdx = petStageIndex(totalWins);
    const nextStage = PET_STAGES[stageIdx+1] || null;
    const mood = petMood(day);
    const pet = {
      stageLabel: PET_STAGES[stageIdx].label,
      totalWins,
      nextThreshold: nextStage ? nextStage.min : null,
      nextLabel: nextStage ? nextStage.label : null,
      daysToNext: nextStage ? nextStage.min - totalWins : null,
      progressPct: nextStage ? Math.max(4, Math.min(100, Math.round(((totalWins - PET_STAGES[stageIdx].min) / (nextStage.min - PET_STAGES[stageIdx].min)) * 100))) : 100,
    };

    const week = last7Keys().map(k=>{
      const d = fmtDate(k);
      const entry = state.days[k];
      let icon = '·';
      if (entry && entry.saved) {
        const m = pillarsMet(entry);
        icon = m === 3 ? '🔥' : m === 2 ? '🙂' : m === 1 ? '😬' : '❌';
      } else if (k === key) {
        icon = '⏳';
      }
      const isToday = k === key;
      return `<div class="day-chip ${isToday?'today':''}"><div class="dow">${DOW[d.getDay()]}</div><div class="icon">${icon}</div></div>`;
    }).join('');

    root.innerHTML = `
      <div class="header">
        <h1>Más agua, menos coca y chatarra 💜</h1>
        <p>Cumplí los 3 retos y guardá tu día para que ${PET_NAME} crezca</p>
        <p id="save-status" style="margin-top:4px;font-size:11px;color:var(--ink-soft);"></p>
      </div>

      <div class="streak-band">
        <div><div class="streak-num">${streak}</div><div class="streak-label">${streak === 1 ? 'día de racha' : 'días de racha'}</div></div>
        <div class="streak-flame">🔥</div>
        <div class="streak-best">Mejor racha<b>${best}</b></div>
      </div>

      <div class="card pet-card">
        <div class="pet-name">${PET_NAME}</div>
        <div class="pet-stage-label">${pet.stageLabel} · ${pet.totalWins} ${pet.totalWins === 1 ? 'día ganado' : 'días ganados'}</div>
        <div class="pet-wrap">
          <div class="pet-anim ${mood}">${catSVG(stageIdx, mood)}</div>
          ${mood === 'joy' ? `<span class="sparkle" style="top:-6px; left:-4px;">✨</span><span class="sparkle" style="top:0px; right:-6px; animation-delay:0.4s;">✨</span><span class="sparkle" style="bottom:10px; left:-10px; animation-delay:0.8s;">✨</span>` : ''}
        </div>
        ${pet.nextThreshold !== null
          ? `<div class="pet-progress"><div class="pet-progress-fill" style="width:${pet.progressPct}%"></div></div>
             <div class="pet-next">${pet.daysToNext} ${pet.daysToNext === 1 ? 'día más' : 'días más'} para "${pet.nextLabel}"</div>`
          : `<div class="pet-next">¡Nivel máximo! 🏆</div>`}
      </div>

      <div class="card">
        <div class="card-title"><span class="emoji">🥤</span> Coca-Cola de hoy</div>
        <div class="cola-row">
          <div class="stepper">
            <button data-action="cola-minus" ${locked?'disabled':''}>−</button>
            <div class="val">${day.zero ? '0 ml' : day.cola + ' ml'}</div>
            <button data-action="cola-plus" ${locked?'disabled':''}>+</button>
          </div>
        </div>
        <button class="zero-btn ${day.zero?'active':''}" data-action="toggle-zero" ${locked?'disabled':''}>
          ${day.zero ? '✓ Hoy sin nada de coca' : 'Marcar día sin nada de coca'}
        </button>
        <div class="cola-status ${colaOk(day)?'status-good':'status-bad'}">
          ${colaOk(day) ? (day.zero ? 'Cero coca hoy 💪' : `Dentro del límite de ${COLA_MAX_ML} ml`) : `Te pasaste del límite (${COLA_MAX_ML} ml)`}
        </div>
      </div>

      <div class="card">
        <div class="card-title"><span class="emoji">💧</span> Agua de hoy</div>
        <div class="glasses">
          ${Array.from({length:8}).map((_,i)=>`<div class="glass ${i < day.glasses ? 'filled':''} ${locked?'disabled':''}" data-idx="${i}">💧</div>`).join('')}
        </div>
        <div class="water-total">Llevás <b>${(day.glasses*GLASS_ML/1000).toFixed(2)} L</b> de ${(WATER_GOAL_ML/1000)} L · cada vaso = ${GLASS_ML} ml</div>
      </div>

      <div class="card">
        <div class="card-title"><span class="emoji">🍟</span> Comida chatarra de hoy</div>
        <div class="cola-row">
          <div class="stepper junk">
            <button data-action="junk-minus" ${locked?'disabled':''}>−</button>
            <div class="val">${day.junk} ${day.junk === 1 ? 'vez' : 'veces'}</div>
            <button data-action="junk-plus" ${locked?'disabled':''}>+</button>
          </div>
        </div>
        <div class="cola-status ${junkOk(day)?'status-good':'status-junk-bad'}">
          ${junkOk(day) ? 'Cero comida chatarra 👏' : `Van ${day.junk} ${day.junk === 1 ? 'vez' : 'veces'} hoy`}
        </div>
      </div>

      <div class="card save-card">
        ${locked
          ? `<div class="saved-banner ${met===3?'win':(met===0?'fail':'mid')}">${met===3 ? '¡Día guardado y cumplido! 🎉' : met===0 ? 'Día guardado — sin cumplir hoy' : 'Día guardado — cumpliste ' + met + ' de 3'}</div>
             <button class="edit-link" data-action="unlock">Editar el día de hoy</button>`
          : `<div class="save-preview">Vas ${met}/3 ahora mismo</div>
             <button class="save-btn" data-action="save-day">Guardar día de hoy</button>`}
      </div>

      <div class="card">
        <div class="card-title"><span class="emoji">📅</span> Últimos 7 días</div>
        <div class="week-strip">${week}</div>
        <p style="font-size:11px;color:var(--ink-soft);margin:8px 0 0;">🔥 3 de 3 · 🙂 2 de 3 · 😬 1 de 3 · ❌ 0 de 3 · ⏳ hoy sin guardar · · sin datos</p>
      </div>

      <div class="card">
        <div class="card-title"><span class="emoji">🗂️</span> Respaldo manual</div>
        <p style="margin:0 0 8px;font-size:12.5px;color:var(--ink-soft);">Copiá este código a Notas por si acaso. Si algún día ves todo en cero, pegalo aquí para recuperarlo.</p>
        <textarea id="backup-box" readonly style="width:100%;height:60px;font-size:11px;border-radius:10px;border:1px solid var(--line);padding:8px;color:var(--ink-soft);resize:none;">${JSON.stringify(state.days)}</textarea>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button class="zero-btn" style="margin:0;flex:1;" id="backup-copy">Copiar</button>
          <button class="zero-btn" style="margin:0;flex:1;" id="backup-restore">Restaurar</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><span class="emoji">⏰</span> Recordatorio</div>
        <p style="margin:0;font-size:12.5px;color:var(--ink-soft);">Tenés un recordatorio diario en Reminders a las 6:00 pm.</p>
      </div>
    `;

    if (!locked){
      document.querySelector('[data-action="cola-plus"]').onclick = () => { day.cola = Math.min(3000, day.cola + 50); if (day.cola>0) day.zero=false; persist(); render(); };
      document.querySelector('[data-action="cola-minus"]').onclick = () => { day.cola = Math.max(0, day.cola - 50); persist(); render(); };
      document.querySelector('[data-action="toggle-zero"]').onclick = () => { day.zero = !day.zero; if (day.zero) day.cola = 0; persist(); render(); };
      document.querySelectorAll('.glass').forEach(g => { g.onclick = () => { const idx = Number(g.dataset.idx); if (idx < day.glasses) day.glasses = idx; else day.glasses = idx + 1; persist(); render(); }; });
      document.querySelector('[data-action="junk-plus"]').onclick = () => { day.junk = Math.min(20, day.junk + 1); persist(); render(); };
      document.querySelector('[data-action="junk-minus"]').onclick = () => { day.junk = Math.max(0, day.junk - 1); persist(); render(); };
      document.querySelector('[data-action="save-day"]').onclick = () => {
        day.saved = true;
        persist();
        if (dayWin(day)) launchCelebration();
        render();
      };
    } else {
      document.querySelector('[data-action="unlock"]').onclick = () => { day.saved = false; persist(); render(); };
    }
    document.getElementById('backup-copy').onclick = () => {
      const box = document.getElementById('backup-box'); box.select();
      try { navigator.clipboard.writeText(box.value); document.getElementById('backup-copy').textContent = 'Copiado ✓'; } catch(e) { document.execCommand('copy'); }
    };
    document.getElementById('backup-restore').onclick = () => {
      const pasted = prompt('Pegá aquí el código de respaldo:');
      if (!pasted) return;
      try { state.days = JSON.parse(pasted); persist(); render(); } catch(e) { alert('Ese texto no parece un respaldo válido.'); }
    };
  }

  (async function init(){ await loadState(); render(); })();
})();
</script>
</body>
</html>
